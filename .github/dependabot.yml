version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: 
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(actions)"
    open-pull-requests-limit: 5
